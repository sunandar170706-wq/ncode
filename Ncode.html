<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#181818">
<title>Ncode</title>
<style>
:root{--bg:#0a0a0a;--side:#141414;--bd:#2a2a2a;--tx:#d4d4d4;--mut:#8a8a8a;--brand:#007acc;--acc:#0e8ce6;--ok:#4ec9b0;--err:#f48771;--warn:#e5c07b;--ed:#0d0d0d;
--mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--tx);overflow:hidden;-webkit-text-size-adjust:100%}
button{font-family:inherit}
#stage{position:fixed;inset:0;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
#stage.rot{inset:auto;top:0;left:0;transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}
#app{height:100%;display:flex;flex-direction:column;padding-left:var(--sal);padding-right:var(--sar)}

.top{flex:none;display:flex;align-items:center;gap:6px;background:var(--side);border-bottom:1px solid var(--bd);color:#fff;padding:calc(6px + var(--sat)) 10px 6px}
#brand svg{display:block;width:28px;height:28px}
.name{flex:1;font-size:16px;font-weight:700;letter-spacing:.3px}
.btn{border:0;border-radius:4px;padding:7px 10px;font-size:12px;color:#ddd;background:#2a2a2a;white-space:nowrap}
.btn:active{opacity:.7}
.btn.run{background:var(--brand);color:#fff;font-weight:700;font-size:13px;padding:7px 12px}
.btn.sm{padding:5px 8px}
.btn.err{background:#7a2a20;color:#fff}
.ic{display:none;font-style:normal;font-size:16px;line-height:1}
.landonly{display:none}
@media (max-width:419px){.name{display:none}.top{justify-content:space-between}}

.tabbar{flex:none;display:flex;background:var(--side);border-bottom:1px solid var(--bd)}
.tab{flex:1;padding:9px 8px;font-size:13px;color:var(--mut);background:transparent;border:0;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:#fff;border-bottom-color:var(--brand);background:var(--bg)}
.bd{background:var(--err);color:#111;border-radius:8px;padding:0 6px;margin-left:6px;font-size:11px}

.main{flex:1;min-height:0;min-width:0;position:relative}
.pane{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
.pane.active{display:flex}
.bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 10px;background:var(--side);border-bottom:1px solid var(--bd);border-top:1px solid var(--bd);font-size:12px}
.bar .crumb{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .acts{flex:none;display:flex;gap:6px}
.splitonly{display:none}
.main.split .splitonly{display:inline-block}
.main.split{display:flex;flex-direction:column}
.main.split .pane{position:relative;inset:auto;min-height:0;min-width:0}
.main.split #pane-editor{flex:0 0 calc(var(--r,50) * 1%)}
.main.split #pane-preview{flex:1 1 0}
.main.split .pane.fs{position:fixed;inset:0}
#div{display:none;flex:none;height:20px;position:relative;z-index:5;align-items:center;justify-content:center;background:var(--bd);touch-action:none;cursor:row-resize;user-select:none;-webkit-user-select:none}
#div::before{content:"";position:absolute;left:0;right:0;top:-14px;bottom:-14px}
#div::after{content:"";width:56px;height:5px;border-radius:3px;background:#666}
#div.on{background:var(--brand)}
.main.split #div{display:flex}
.main.dragging iframe{pointer-events:none}

/* ===== Mode miring / PC: bar samping, editor + preview penuh ===== */
.land #app,.land{--k:1}
#app.land{flex-direction:row;padding-top:var(--sat);padding-bottom:var(--sab)}
.land .top{flex-direction:column;align-items:stretch;justify-content:flex-start;width:46px;height:100%;padding:6px 4px;gap:6px;border-bottom:0;border-right:1px solid var(--bd);overflow-y:auto;scrollbar-width:none}
.land .top::-webkit-scrollbar{display:none}
.land #brand{align-self:center}
.land .name,.land .lb,.land .tabbar,.land .status,.land .keys,.land .crumb{display:none}
.land .ic,.land .landonly{display:block}
.land .btn,.land .btn.run{padding:9px 0;text-align:center;font-size:14px}
.land .btn.run{font-size:16px}
.land .main.split{flex-direction:row}
.land #div{width:14px;height:auto;cursor:col-resize}
.land #div::before{top:0;bottom:0;left:-14px;right:-14px}
.land #div::after{width:5px;height:56px}
.land .chip{padding:6px 12px}
.land .chip.tool{padding:4px 10px}
.land #pv-bar{display:none}
.land #pv-bar:active,.land #pv-bar:hover{opacity:1}
.land #pv-bar .btn{background:#2a2a2a}
.land .pane.fs{padding-top:var(--sat)}
.land #toast{bottom:16px}

.files{flex:none;display:flex;overflow-x:auto;background:var(--side);border-bottom:1px solid var(--bd);scrollbar-width:none}
.files::-webkit-scrollbar,.keys::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;font-size:12px;color:var(--mut);background:transparent;border:0;border-bottom:2px solid transparent}
.chip.active{color:#fff;border-bottom-color:var(--brand);background:var(--ed)}
.chip.tool{color:#4fa8ff;font-size:14px;padding:6px 11px}

/* ===== Editor (virtual: hanya baris terlihat yang digambar) ===== */
.editor{flex:1;min-height:0;display:flex;background:var(--ed)}
#gut{flex:none;width:46px;overflow:hidden;position:relative;border-right:1px solid #1f1f1f}
#gi{position:absolute;left:0;right:0;top:0}
.gl{height:19px;text-align:right;padding-right:8px;color:#5a5a5a;font:11px/19px var(--mono)}
.cw{flex:1;min-width:0;position:relative}
#hl,#code{position:absolute;inset:0;margin:0;border:0;outline:0;resize:none;font:12px/19px var(--mono);font-variant-ligatures:none;letter-spacing:0;white-space:pre;tab-size:2;-moz-tab-size:2}
#hl{overflow:hidden;pointer-events:none;color:#d4d4d4}
#hli{position:absolute;left:0;top:0;padding-left:10px;min-width:100%}
.r{height:19px}
.wrap #gut{display:none}
.wrap #hl,.wrap #code{white-space:pre-wrap;overflow-wrap:break-word;word-break:normal}
.wrap #hl{padding:8px 10px 0 52px}
.wrap #code{padding:8px 10px 120px 52px}
.wrap #hli{position:relative;padding:0;min-width:0;counter-reset:l}
.wrap #hli::after{content:"";display:block;height:120px}
.wrap .r{height:auto;min-height:19px;position:relative}
.wrap .r::before{counter-increment:l;content:counter(l);position:absolute;left:-44px;width:34px;text-align:right;color:#5a5a5a;font-size:11px}
.wrap .cw::before{content:"";position:absolute;top:0;bottom:0;left:46px;width:1px;background:#1f1f1f;z-index:2}
#code{padding:8px 10px 120px 10px;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:#fff;overflow:auto;scrollbar-width:none;z-index:1}
#code::-webkit-scrollbar{display:none}
#code::selection{background:rgba(14,140,230,.4)}
#code::placeholder{color:#555;-webkit-text-fill-color:#555}
.t{color:#569cd6}.a{color:#9cdcfe}.s{color:#ce9178}.c{color:#6a9955;font-style:italic}.k{color:#c586c0}.n{color:#b5cea8}.f{color:#dcdcaa}.p{color:#9cdcfe}.l{color:#d7ba7d}.m{color:#808080}

.keys{flex:none;display:flex;overflow-x:auto;background:var(--side);border-top:1px solid var(--bd);scrollbar-width:none}
.keys button{flex:1 0 auto;min-width:38px;padding:9px 8px;border:0;background:transparent;color:var(--tx);font:14px var(--mono)}
.keys button:active{background:var(--brand)}

#fwrap{flex:1;min-height:0;position:relative;overflow:hidden;background:#fff}
#frame{position:absolute;left:0;top:0;width:100%;height:100%;border:0;background:#fff;transform-origin:0 0}
.pane.fs{position:fixed;inset:0;z-index:6000;padding-top:var(--sat);padding-left:var(--sal);padding-right:var(--sar)}

#con{flex:1;overflow:auto;padding:8px 12px;font:12px/18px var(--mono);background:#000}
.ln{white-space:pre-wrap;word-break:break-word;padding:1px 0}
.ln.warn{color:var(--warn)}.ln.error{color:var(--err)}.ln.sys{color:var(--mut)}.ln.ok{color:var(--ok)}
.ln.go{cursor:pointer}.ln.go:active{background:#1b1b1b}
.cmdrow{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--side);border-top:1px solid var(--bd)}
.cmdrow span{font:700 14px var(--mono);color:var(--ok)}
#cmd{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font:16px var(--mono)}
#cmd::placeholder{color:#555;font-size:13px}

.status{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--brand);color:#fff;font-size:11px;padding:3px 10px calc(3px + var(--sab));white-space:nowrap}
.status .l{display:flex;gap:14px;min-width:0;overflow:hidden}
.status b{font-weight:600;letter-spacing:.3px}
#toast{position:fixed;left:50%;bottom:calc(44px + var(--sab));transform:translate(-50%,10px);z-index:9000;max-width:90%;padding:9px 14px;border-radius:4px;background:#2a2a2a;color:#fff;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.ok{border-left:3px solid var(--ok)}#toast.err{border-left:3px solid var(--err)}

#splash{position:fixed;inset:0;z-index:10000;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .25s ease,visibility .25s}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
#lg svg{display:block;width:min(44vw,180px);height:min(44vw,180px);overflow:visible}
#lg #sq{transform-box:fill-box;transform-origin:center}
#lg #bar{transform-box:fill-box;transform-origin:50% 100%}
#cap{margin-top:28px;height:22px;display:flex;align-items:center;font:500 15px var(--mono);letter-spacing:3px;color:#ccc}
.caret{display:inline-block;width:2px;height:1.15em;background:#999;margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.caret{animation:none}}
.modal{position:fixed;inset:0;z-index:7000;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.7)}
.modal.open{display:flex}
.box{width:100%;max-width:380px;max-height:100%;overflow:auto;background:var(--side);border:1px solid var(--bd);border-radius:8px;padding:16px}
.box h2{font-size:15px;color:#fff;margin-bottom:12px;font-weight:600}
.box p{font-size:12px;color:var(--mut);margin:14px 0 6px}
.box input{width:100%;background:#0a0a0a;border:1px solid var(--bd);border-radius:4px;color:#fff;padding:10px;font-size:16px;outline:0}
.box input:focus{border-color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid.one{grid-template-columns:1fr}
.grid button{padding:12px 10px;border:1px solid var(--bd);border-radius:6px;background:#0a0a0a;color:#fff;font-size:14px;text-align:left}
.grid button small{display:block;margin-top:3px;font:11px var(--mono);color:var(--mut);overflow-wrap:anywhere}
.grid button:active{border-color:var(--acc)}
.box .row{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
</style>
</head>
<body>
<div id="splash" aria-label="Ncode by nandar">
  <div id="lg"></div>
  <div id="cap"><span id="capt"></span><i class="caret"></i></div>
</div>

<div id="stage">
<div id="app">
  <header class="top" id="top">
    <span id="brand"></span>
    <span class="name">Ncode</span>
    <button class="btn" id="btn-layout"><i class="ic">&#9707;</i><span class="lb">Terpisah</span></button>
    <button class="btn" id="btn-cycle" style="display:none" aria-label="Ganti tampilan"><i class="ic">&#9776;</i></button>
    <button class="btn" id="btn-mode"><i class="ic">&#9645;</i><span class="lb">Potret</span></button>
    <button class="btn landonly" id="btn-full" aria-label="Layar penuh"><i class="ic">&#9974;</i></button>
    <button class="btn landonly" id="btn-term" aria-label="Konsol"><i class="ic">&gt;_</i></button>
    <button class="btn" id="btn-save"><i class="ic">&#8681;</i><span class="lb">Simpan</span></button>
    <button class="btn run" id="btn-run"><i class="ic">&#9654;</i><span class="lb">&#9654; Jalankan</span></button>
  </header>
  <nav class="tabbar" id="tabbar" role="tablist"></nav>

  <main class="main" id="main">
    <section class="pane active" id="pane-editor">
      <div class="files" id="files"></div>
      <div class="editor wrap" id="ed-box">
        <div id="gut"><div id="gi"></div></div>
        <div class="cw">
          <div id="hl" aria-hidden="true"><div id="hli"></div></div>
          <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="Ketik kode di sini. Ekstensi file menentukan bahasa: .html .css .js"></textarea>
        </div>
      </div>
      <div class="keys" id="keys"></div>
    </section>

    <div id="div" role="separator" aria-label="Geser untuk atur ukuran"></div>

    <section class="pane" id="pane-preview">
      <div class="bar" id="pv-bar"><div class="crumb" id="pv-name">Pratinjau</div>
        <div class="acts">
          <button class="btn sm splitonly" id="btn-ratio">50%</button>
          <button class="btn sm landonly" id="btn-desk" aria-label="Tampilan desktop">PC</button>
          <button class="btn sm splitonly" id="btn-live">Live</button>
          <button class="btn sm" id="btn-reload" aria-label="Muat ulang">&#10227;</button>
          <button class="btn sm" id="btn-fs" aria-label="Layar penuh preview">&#9974;</button>
        </div></div>
      <div id="fwrap"><iframe id="frame" title="Preview" sandbox="allow-scripts allow-forms allow-modals allow-pointer-lock allow-downloads"></iframe></div>
    </section>

    <section class="pane" id="pane-term">
      <div class="bar"><div class="crumb" style="display:block">Konsol &middot; ketuk error untuk lompat ke kode</div>
        <div class="acts"><button class="btn sm" id="btn-ccopy">Salin</button><button class="btn sm" id="btn-cclear">Bersihkan</button></div></div>
      <div id="con"></div>
      <div class="cmdrow"><span>$</span>
        <input id="cmd" type="text" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="send" placeholder="help, atau ketik JavaScript">
      </div>
    </section>
  </main>

  <footer class="status">
    <div class="l"><span id="st-save">Tersimpan</span><span id="st-pos">Ln 1, Kol 1</span><span id="st-lang">HTML</span></div>
    <b>BY nandar</b>
  </footer>
</div>
<div class="modal" id="picker">
  <div class="box">
    <h2>File baru</h2>
    <div class="grid" id="pgrid"></div>
    <p>Atau ketik nama sendiri (contoh: data.json, utils.js)</p>
    <input id="pname" type="text" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="namafile.js">
    <div class="row"><button class="btn" id="p-cancel">Batal</button><button class="btn run" id="p-ok">Buat</button></div>
  </div>
</div>
<div class="modal" id="sv">
  <div class="box">
    <h2>Simpan &amp; buka file</h2>
    <div class="grid one" id="svg"></div>
    <div class="row"><button class="btn" id="sv-x">Tutup</button></div>
  </div>
</div>
<div class="modal" id="dlg"><div class="box"><h2 id="dlg-t"></h2><p id="dlg-p" style="margin-top:0"></p>
<input id="dlg-i" type="text" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">
<div class="row"><button class="btn" id="dlg-c">Batal</button><button class="btn run" id="dlg-ok">OK</button></div></div></div>
<input type="file" id="fin" multiple hidden accept=".html,.htm,.css,.js,.json,.md,.txt,text/*">
<div id="toast" role="status"></div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var has = function (o, k) { return Object.prototype.hasOwnProperty.call(o, k); };
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  };
  function lbl(id, t) { $(id).querySelector(".lb").textContent = t; }

  /* ---------- Logo ---------- */
  var D_BAR = "M238 303H443V967Q443 1022 388 1022H293Q238 1022 238 967Z";
  var D_N = "M238 303V295Q238 250 283 250H415Q465 250 505 295L807 655V295Q807 250 852 250H968Q1013 250 1013 295V885L822 771L801 790L891 995L900 978H1013V1022H895Q845 1022 800 975Z";
  function logoSvg(ids) {
    return '<svg viewBox="0 0 1250 1250" aria-hidden="true"><rect ' + (ids ? 'id="sq" ' : '') + 'width="1250" height="1250" rx="215" fill="#1c6bb8"/>' +
      '<path ' + (ids ? 'id="bar" ' : '') + 'd="' + D_BAR + '" fill="#2e7dd9"/>' +
      (ids ? '<clipPath id="wipe"><rect id="wr" width="0" height="1250"/></clipPath>' : '') +
      '<path ' + (ids ? 'id="nn" clip-path="url(#wipe)" ' : '') + 'd="' + D_N + '" fill="#fff"/></svg>';
  }
  $("brand").innerHTML = logoSvg(false);
  $("lg").innerHTML = logoSvg(true);
  (function () {
    var l = document.createElement("link"); l.rel = "icon";
    l.href = "data:image/svg+xml," + encodeURIComponent(logoSvg(false).replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" '));
    document.head.appendChild(l);
  })();

  /* ---------- Splash ---------- */
  var splashDone = false;
  function hideSplash() { if (splashDone) return; splashDone = true; var s = $("splash"); s.classList.add("out"); setTimeout(function () { s.style.display = "none"; }, 400); }
  $("splash").addEventListener("click", hideSplash);
  setTimeout(hideSplash, 2500);
  (function () {
    var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    var wr = $("wr"), txt = "BY nandar", i = 0;
    function typeNext() {
      if (splashDone) return;
      if (i < txt.length) { $("capt").textContent = txt.slice(0, ++i); setTimeout(typeNext, reduce ? 0 : 22); }
      else setTimeout(hideSplash, 300);
    }
    function wipe(ms, done) {
      var t0 = performance.now();
      (function f(t) {
        var p = Math.min(1, (t - t0) / ms); p = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
        wr.setAttribute("width", 1250 * p);
        if (p < 1 && !splashDone) requestAnimationFrame(f); else if (done) done();
      })(t0);
    }
    if (reduce || !$("sq").animate) { wr.setAttribute("width", 1250); typeNext(); return; }
    $("sq").animate([{ transform: "scale(.82)", opacity: 0 }, { transform: "scale(1)", opacity: 1 }], { duration: 240, easing: "cubic-bezier(.2,.9,.3,1.12)", fill: "both" });
    $("bar").animate([{ transform: "scaleY(0)" }, { transform: "scaleY(1)" }], { duration: 240, delay: 180, easing: "cubic-bezier(.3,.7,.2,1)", fill: "both" });
    setTimeout(function () { wipe(350, typeNext); }, 380);
  })();

  var toastTimer;
  function toast(msg, type) { var t = $("toast"); t.textContent = msg; t.className = "show " + (type || ""); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.className = ""; }, 2600); }

  /* ---------- Data ---------- */
  var K = { files: "ncode.files", active: "ncode.active" };
  var files = {};
  try { files = JSON.parse(store.get(K.files, store.get("devot.files", "{}"))); } catch (e) {}
  if (!files || typeof files !== "object") files = {};
  if (!Object.keys(files).length) files = { "index.html": store.get("devot.code", "") };
  var ver = store.get("ncode.v", "");
  if (ver !== "3") {
    if (ver !== "1" && ver !== "2") {
      var MARK = { "index.html": "Halo dari DevOt", "style.css": "background:#101820", "app.js": "Klik ke-", "main.py": "Python jalan langsung" };
      Object.keys(MARK).forEach(function (n) { if (has(files, n) && files[n].length < 400 && files[n].indexOf(MARK[n]) > -1) delete files[n]; });
      if (!Object.keys(files).length) files = { "index.html": "" };
    }
    store.set("ncode.layout", "split");
    store.set("ncode.v", "3");
  }
  var active = store.get(K.active, store.get("devot.active", "index.html"));
  if (!has(files, active)) active = Object.keys(files)[0];
  var ext = function (n) { var m = /\.([a-z0-9]+)$/i.exec(n); return m ? m[1].toLowerCase() : ""; };
  var LANG = { html: "HTML", htm: "HTML", css: "CSS", js: "JavaScript", json: "JSON", md: "Markdown" };
  var MIME = { html: "text/html", htm: "text/html", css: "text/css", js: "text/javascript", json: "application/json", md: "text/markdown" };

  var layout = store.get("ncode.layout", "split") === "tabs" ? "tabs" : "split";
  var ratio = Math.max(10, Math.min(90, parseFloat(store.get("ncode.ratio", "50")) || 50));
  var live = store.get("ncode.live", "1") === "1";
  var desk = store.get("ncode.desk", "0") === "1";
  var current = "editor", errs = 0, toasted = false, ready = false, lmap = [null], liveT, sig = "", dirty = 0;

    var s = hook(n) + "<body><scr" + "ipt>/*@@NB:" + n + "@@*/\n" + files[n].replace(/<\/script/gi, "<\\/script") + "\n/*@@NE@@*/</scr" + "ipt></body>";
    sig = ""; ready = false; lmap = buildMap(s, "(runner)"); $("frame").srcdoc = s;
  }
  function exitFs() { $("pane-preview").classList.remove("fs"); $("btn-fs").innerHTML = "&#9974;"; }
  $("btn-reload").addEventListener("click", function () { loadPreview(); });
  $("btn-fs").addEventListener("click", function () { var on = $("pane-preview").classList.toggle("fs"); $("btn-fs").innerHTML = on ? "&#10005;" : "&#9974;"; setTimeout(fitFrame, 30); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { exitFs(); closePicker(); closeDlg(false); $("sv").classList.remove("open"); } });

  /* ---------- Jalankan ---------- */
  function runFile(n) {
    files[active] = ed.value; errs = 0; toasted = false; renderTabs();
    out("\x1b[90m\u25b6 " + n + "\x1b[0m");
    var e = ext(n);
    if (e === "js") { runJs(n); switchView(layout === "split" ? "split" : "term"); }
    else if (/^html?$/.test(e)) { loadPreview(n); switchView(layout === "split" ? "split" : "preview"); }
    else out("Tidak bisa menjalankan file ." + (e || "tanpa ekstensi"), "error");
  }
  function run() {
    persist(true);
    var e = ext(active);
    if (e === "js" || /^html?$/.test(e)) runFile(active);
    else { var n = entry(); if (n) runFile(n); else out("Belum ada file HTML untuk dijalankan", "error"); }
  }
  $("btn-run").addEventListener("click", run);

  /* ---------- Mulai ---------- */
  out("\x1b[1m\x1b[96mNcode\x1b[0m \x1b[90mby nandar\x1b[0m\nError JavaScript muncul di sini lengkap dengan \x1b[93mfile:baris:kolom\x1b[0m. Ketuk untuk lompat ke kodenya.\nKetik \x1b[93mhelp\x1b[0m untuk perintah.");
  setValue(files[active]); renderFiles(); setLayoutLabel(); setRatio(ratio);
  $("btn-live").style.opacity = live ? 1 : .45;
  switchView(layout === "split" ? "split" : "editor");
  applyMode();
  if (layout === "split") loadPreview(null, true);
  window.addEventListener("pagehide", function () { persist(true); });
  document.addEventListener("visibilitychange", function () { if (document.hidden) persist(true); });
})();
</script>
